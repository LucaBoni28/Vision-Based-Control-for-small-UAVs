# =============================================================================
# Drone tracking system — configuration
# =============================================================================

mavlink:
  connection: "udpin:0.0.0.0:14551"
  source_system: 255
  source_component: 191
  attitude_stream_rate_hz: 10

# TCP video stream from Jetson Orin NX to Ground Station (GStreamer + OpenCV)
video_link:
  host: "172.29.249.199"
  port: 5005

# GStreamer CSI pipeline parameters (Jetson nvarguscamerasrc)
camera:
  sensor_id: 0
  width: 1280
  height: 960
  framerate: 30

model:
  path: "yolo26n.engine"
  task: "detect"

# YOLO26n model (Ultralytics) parameters
detection:
  # class 0 = person, class 62 = monitor (COCO)
  classes: [62]
  confidence: 0.65

tracker:
  backend: "bytetrack"            # bytetrack, botsort, deepsort
  config_file: "bytetrack.yaml"   # ultralytics tracker yaml, only used when backend is bytetrack/botsort
  max_timeout_frames: 50          # frames to keep memory of a lost target

  # Only used when backend: "deepsort"
  deepsort:
    max_age: 50                   # frames to remember a lost track
    embedder: "mobilenet"         # visual fingerprint network
    half: false                   # FP16 precision (Orin NX Tensor Cores)
    max_cosine_distance: 0.8      # higher = tolerate more lighting/shadow change
    n_init: 1                     # frames needed to confirm a new track
    max_iou_distance: 0.8         # allows faster inter-frame motion

# Control gains for the PD controller that drives the drone to follow the target
control:
  k_p_yaw: 1.0             # Proportional gain, yaw rate
  k_d_yaw: 0.05            # Derivative gain, yaw rate
  k_p_vz: 1.0              # Proportional gain, vertical velocity
  k_d_vz: 0.05             # Derivative gain, vertical velocity
  k_p_vx: 1.0              # Max forward velocity, m/s
  r_stop: 0.8              # Radius (normalized) beyond which forward motion halts
  yaw_deadzone: 0.03
  vz_deadzone: 0.03
  area_deadzone: 0.05
  max_derivative_dt: 0.5   # ignore derivative term if dt exceeds this

# Calibration parameters
calibration:
  file: "calibration.json"              # Calibration data generated by calibrate.py
  desired_stopping_distance_m: 0.6      # Desired distance from the target when the drone stops moving forward
  fallback_optical_constant: 168750.0   

# Display parameters for the Ground Station video window and stream
display:
  stream_width: 640
  stream_height: 480
  jpeg_quality: 60
  ground_station_window_width: 1280
  ground_station_window_height: 720

# Target selection mode for the tracking system
# "auto"    -> lock onto the first detected object)
# "manual"  -> operator clicks the target on the ground-station video window
# "nearest" -> lock onto whichever detected object appears closest (largest
#              bounding box). Intended for autonomous waypoint missions
#              (main_mission.py) with no operator present to click
target_selection:
  mode: "manual"
  # max_click_distance_px: 250 # Threshold for accepting a click as valid (in pixels)

# Return channel: ground station -> Jetson, carrying operator clicks. Only used when target_selection.mode is "manual"
# This is separate from video_link (which only flows Jetson -> ground station).
command_link:
  jetson_host: "172.29.249.164"   # IP of the Jetson as seen from the ground station — SET THIS
  port: 5006

# Multi-waypoints mission is intended for autonomous operation with no operator present to click on a target.
waypoints:
  loop_mission: true             # After the last waypoint, restart from the first ("repeat the task")
  reach_threshold_m: 3.0         # GPS distance considered "arrived" at a waypoint
  transit_forward_velocity: 2.0  # m/s while flying toward a waypoint
  transit_yaw_kp: 1.5            # P gain steering yaw rate toward waypoint bearing during transit
  max_tracking_duration_s: 20.0  # auto-advance to next waypoint if still engaging a target after this long
  points:
    - lat: 47.4721425
      lon: 19.0602198
      label: "Waypoint 1"
    - lat: 47.4725015
      lon: 19.0608072
      label: "Waypoint 2"
    - lat: 47.4723438
      lon: 19.0611774
      label: "Waypoint 3"
    - lat: 47.4719957
      lon: 19.0605953
      label: "Waypoint 4"